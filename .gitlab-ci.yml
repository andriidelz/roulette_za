stages: [build, deploy]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG == "release"'
    - when: never

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/apps"

.defaults: &defaults
  tags: ["docker-sock"] # runner tags

.before_docker: &before_docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build:release:
  <<: [*defaults, *before_docker]
  stage: build
  image: docker:24
  script:
    - git fetch --tags --force
    - TAGS_ON_COMMIT=$(git tag --points-at "$CI_COMMIT_SHA")
    - echo "Git tags on this commit:"
    - echo "$TAGS_ON_COMMIT"
    - DOCKER_TAG_ARGS=""
    - |
      for GIT_TAG in $TAGS_ON_COMMIT; do
        SANITIZED_TAG=$(echo "$GIT_TAG" | sed 's|^release/||')
        DOCKER_TAG_ARGS="$DOCKER_TAG_ARGS -t $IMAGE_NAME:$SANITIZED_TAG"
      done
    - echo "Docker build args => $DOCKER_TAG_ARGS"
    - docker build --pull $DOCKER_TAG_ARGS .
    - |
      for GIT_TAG in $TAGS_ON_COMMIT; do
        SANITIZED_TAG=$(echo "$GIT_TAG" | sed 's|^release/||')
        docker push "$IMAGE_NAME:$SANITIZED_TAG"
      done

deploy:release:
  <<: *defaults
  stage: deploy
  needs: ["build:release"]
  image: curlimages/curl:8.10.1
  script:
    - 'echo "=== Portainer webhook debug ==="'
    - 'echo "Webhook URL: ${PORTAINER_TEST_WEBHOOK}"'
    - 'echo "--- Testing connection (GET) ---"'
    - 'curl -sS -o /dev/null -w "GET status: %{http_code}\n" -X GET "$PORTAINER_TEST_WEBHOOK" || true'
    - 'echo "--- Triggering redeploy (POST) ---"'
    - 'HTTP_CODE=$(curl -sS -w "%{http_code}" -o response.txt -X POST "$PORTAINER_TEST_WEBHOOK"); echo "POST status: $HTTP_CODE"; echo "--- Response body ---"; cat response.txt; rm -f response.txt'
