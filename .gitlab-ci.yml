stages: [lint, test, build, security, deploy]

workflow:
  rules:
    - when: always

default:
  tags: ["docker-sock"]

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/apps"
  DOCKER_BUILDKIT: "1"
  TAG_REGEX: '^v0\.[0-9]{4}\.[0-9]{2}(\.[0-9]+)?(-rc[0-9]*)?$'

.tag_rule: &tag_rule
  if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^v0\.[0-9]{4}\.[0-9]{2}(\.[0-9]+)?(-rc[0-9]*)?$/'

.docker_login: &docker_login
  before_script:
    - apk add --no-cache curl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# ============== LINT ==============
lint:dockerfile-hadolint:
  stage: lint
  image: ghcr.io/hadolint/hadolint:latest-alpine
  rules: [{ when: always }]
  script:
    - hadolint --version
    - |
      F="$(git ls-files | grep -Ei '(^|.*/)(Dockerfile(\..*)?$|.*Dockerfile.*)' || true)"; \
      [ -z "$F" ] && echo "No Dockerfiles" | tee hadolint.txt || hadolint --ignore DL3018 --failure-threshold error $F | tee hadolint.txt
  artifacts:
    when: always
    paths: [hadolint.txt]
    expire_in: 7 days
  allow_failure: true

lint:go-vet:
  stage: lint
  image: golang:1.25-alpine
  rules: [{ when: always }]
  before_script:
    - apk add --no-cache git
    - go mod download
  script:
    - go vet ./...

lint:go-govulncheck:
  stage: lint
  image: golang:1.25-alpine
  rules: [{ when: always }]
  before_script:
    - apk add --no-cache git
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - export PATH=$PATH:/go/bin
    - go mod download
  script:
    - govulncheck ./... | tee govulncheck.txt
  artifacts:
    when: always
    paths: [govulncheck.txt]
    expire_in: 7 days
  allow_failure: true

lint:go-gosec:
  stage: lint
  image: golang:1.25-alpine
  rules: [{ when: always }]
  before_script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - export PATH=$PATH:/go/bin
    - go mod download
  script:
    - gosec -no-fail -fmt json -out gosec.json ./... # -no-fail <— чтобы job не падал
  artifacts:
    when: always
    paths: [gosec.json]
    expire_in: 7 days
  allow_failure: true

# ============== TEST ==============
test:go-unit:
  stage: test
  image: golang:1.25-alpine
  rules: [{ when: always }]
  before_script:
    - apk add --no-cache git build-base
    - go mod download
  script:
    - go test -race -covermode=atomic -coverprofile=coverage.out ./...
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 7 days

# ============== BUILD (tags only) + PRE-PUSH TRIVY GATE ==============
build:image-and-scan:
  stage: build
  image: docker:24
  <<: *docker_login
  rules:
    - <<: *tag_rule
  needs: ["test:go-unit"]
  variables:
    CANDIDATE_TAG: "$CI_COMMIT_TAG-candidate"
  script:
    - docker buildx create --use || true
    - >
      docker buildx build --pull --load
      --build-arg VERSION="$CI_COMMIT_TAG"
      --build-arg COMMIT="$CI_COMMIT_SHA"
      --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      -t "$IMAGE_NAME:$CANDIDATE_TAG" .
    # Trivy до push (gate: CRITICAL,HIGH)
    - apk add --no-cache curl
    - curl -sL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - trivy image --format table "$IMAGE_NAME:$CANDIDATE_TAG" | tee trivy.txt
    - trivy image --exit-code 1 --severity CRITICAL,HIGH "$IMAGE_NAME:$CANDIDATE_TAG"
    # пушим только если прошли gate
    - docker tag "$IMAGE_NAME:$CANDIDATE_TAG" "$IMAGE_NAME:latest"
    - docker tag "$IMAGE_NAME:$CANDIDATE_TAG" "$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker push "$IMAGE_NAME:latest"
    - docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
  artifacts:
    when: always
    paths: [trivy.txt]
    expire_in: 14 days

# (опционально) отчётный скан из реестра
security:image-registry-report:
  stage: security
  image: alpine:3.20
  rules:
    - <<: *tag_rule
  needs: ["build:image-and-scan"]
  before_script:
    - apk add --no-cache curl
    - curl -sL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - trivy image --exit-code 0 --format table "$IMAGE_NAME:$CI_COMMIT_TAG" | tee trivy-registry.txt
  artifacts:
    when: always
    paths: [trivy-registry.txt]
    expire_in: 14 days
  allow_failure: true

# ================= DEPLOY (manual promotes) =================
deploy:staging:
  stage: deploy
  image: docker:24
  <<: *docker_login
  rules:
    - <<: *tag_rule
      when: manual
  needs: ["build:image-and-scan"]
  environment:
    name: staging
    deployment_tier: staging
  script:
    - echo "Deploy STAGING для $CI_COMMIT_TAG"
    - echo "$CI_COMMIT_TAG" | grep -Eq "$TAG_REGEX" || { echo "Неверный формат CI_COMMIT_TAG"; exit 1; }
    - docker manifest inspect "$IMAGE_NAME:$CI_COMMIT_TAG" >/dev/null 2>&1 || { echo 'Образ не найден'; exit 1; }
    # git tag stage
    - "curl -sS -o /dev/null -w 'DEL:%{http_code}\n' -X DELETE -H \"PRIVATE-TOKEN: $GITLAB_API_TOKEN\" \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/stage\" || true"
    - "curl -sS -o resp_stage.json -w 'POST:%{http_code}\n' -X POST -H \"PRIVATE-TOKEN: $GITLAB_API_TOKEN\" --data \"tag_name=stage\" --data \"ref=$CI_COMMIT_TAG\" \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags\""
    - echo "--- Git API response (stage) ---"; cat resp_stage.json || true
    # docker retag
    - docker pull "$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker tag  "$IMAGE_NAME:$CI_COMMIT_TAG" "$IMAGE_NAME:stage"
    - docker push "$IMAGE_NAME:stage"
    # Portainer webhook
    - |
      URL="$(printf '%s' "$PORTAINER_STAGE_WEBHOOK" | tr -d '\r\n')"
      test -n "$URL" || { echo "PORTAINER_STAGE_WEBHOOK is empty"; exit 1; }
      echo "POST $URL"
      HTTP_CODE="$(curl --fail -sS -o response.txt -w '%{http_code}' -X POST --url "$URL" -H 'Content-Length: 0' --retry 3 --max-time 20)" \
        || { echo "curl failed"; cat response.txt 2>/dev/null || true; exit 1; }
      echo "HTTP => $HTTP_CODE"; head -n 200 response.txt || true; rm -f response.txt
  artifacts:
    when: always
    paths: [resp_stage.json]
    expire_in: 14 days

deploy:production:
  stage: deploy
  image: docker:24
  <<: *docker_login
  rules:
    - <<: *tag_rule
      when: manual
  needs: ["build:image-and-scan"]
  environment:
    name: production
    deployment_tier: production
  script:
    - echo "Deploy PRODUCTION для $CI_COMMIT_TAG"
    - echo "$CI_COMMIT_TAG" | grep -Eq "$TAG_REGEX" || { echo "Неверный формат CI_COMMIT_TAG"; exit 1; }
    - docker manifest inspect "$IMAGE_NAME:$CI_COMMIT_TAG" >/dev/null 2>&1 || { echo 'Образ не найден'; exit 1; }
    # git tag release
    - "curl -sS -o /dev/null -w 'DEL:%{http_code}\n' -X DELETE -H \"PRIVATE-TOKEN: $GITLAB_API_TOKEN\" \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/release\" || true"
    - "curl -sS -o resp_release.json -w 'POST:%{http_code}\n' -X POST -H \"PRIVATE-TOKEN: $GITLAB_API_TOKEN\" --data \"tag_name=release\" --data \"ref=$CI_COMMIT_TAG\" \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags\""
    - echo "--- Git API response (release) ---"; cat resp_release.json || true
    # docker retag
    - docker pull "$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker tag  "$IMAGE_NAME:$CI_COMMIT_TAG" "$IMAGE_NAME:release"
    - docker push "$IMAGE_NAME:release"
    # Portainer webhook
    - |
      URL="$(printf '%s' "$PORTAINER_PROD_WEBHOOK" | tr -d '\r\n')"
      test -n "$URL" || { echo "PORTAINER_PROD_WEBHOOK is empty"; exit 1; }
      echo "POST $URL"
      HTTP_CODE="$(curl --fail -sS -o response.txt -w '%{http_code}' -X POST --url "$URL" -H 'Content-Length: 0' --retry 3 --max-time 20)" \
        || { echo "curl failed"; cat response.txt 2>/dev/null || true; exit 1; }
      echo "HTTP => $HTTP_CODE"; head -n 200 response.txt || true; rm -f response.txt
  artifacts:
    when: always
    paths: [resp_release.json]
    expire_in: 14 days
