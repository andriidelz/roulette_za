services:
  postgres:
    image: postgres:15-alpine
    container_name: roulette-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roulette
    volumes:
      - ./shared-data/postgresql:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roulette"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: roulette-pgadmin
    environment:
      SCRIPT_NAME: /pgadmin
      PGADMIN_PORT: 80
      PGADMIN_DEFAULT_EMAIL: postgres@postgres.com
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # PGADMIN_CONFIG_STORAGE_DIR: /var/lib/pgadmin/storage
    volumes:
      - ./shared-data/pgadmin:/var/lib/pgadmin
      - "./pgadmin4.config.json:/pgadmin4/servers.json"
    ports:
      - "8181:80"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
      image: rabbitmq:3-management
      container_name: roulette-rabbitmq
      ports:
        # - "5672:5672"
        - "15672:15672"
      volumes:
        - ./shared-data/rabbitmq:/var/lib/rabbitmq
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
      healthcheck:
        test: ["CMD", "rabbitmqctl", "status"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roulette-bot
    command: ./roulette-bot
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/roulette?sslmode=disable
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_NAME=${TELEGRAM_NAME}
      - TELEGRAM_RESERVE_CHANNEL_ID=${TELEGRAM_RESERVE_CHANNEL_ID}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # Переменные окружения для OxaPay
      - DEFAULT_PAYMENT_PROVIDER=${DEFAULT_PAYMENT_PROVIDER:-mock}
      - OXAPAY_API_KEY=${OXAPAY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rotator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roulette-rotator
    command: ./roulette-rotator
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/roulette?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roulette-admin
    command: ./roulette-admin
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/roulette?sslmode=disable
      - ADMIN_PORT=8080
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-super_secret_key}
      - DISABLE_IP_FILTERS=true
      # Переменные окружения для OxaPay
      - DEFAULT_PAYMENT_PROVIDER=${DEFAULT_PAYMENT_PROVIDER:-mock}
      - OXAPAY_API_KEY=${OXAPAY_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
