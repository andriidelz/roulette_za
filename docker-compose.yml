# Default logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-infrastructure-logging: &infrastructure-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Database configuration
x-database-config: &database-config
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roulette}?sslmode=disable

# RabbitMQ configuration  
x-rabbitmq-config: &rabbitmq-config
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/

# Redis configuration
x-redis-config: &redis-config
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: ${REDIS_DB:-0}

# Telegram configuration
x-telegram-config: &telegram-config
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
  TELEGRAM_NAME: ${TELEGRAM_NAME}
  TELEGRAM_RESERVE_CHANNEL_ID: ${TELEGRAM_RESERVE_CHANNEL_ID}

# Payment configuration
x-payment-config: &payment-config
  DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-mock}
  OXAPAY_API_KEY: ${OXAPAY_API_KEY}

# PostgreSQL environment variables
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-roulette}

# RabbitMQ environment variables
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

# Redis environment variables
x-redis-env: &redis-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}

# PgAdmin configuration
x-pgadmin-config: &pgadmin-config
  SCRIPT_NAME: /pgadmin
  PGADMIN_PORT: 80
  PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-postgres@postgres.com}
  PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-postgres}
  PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
  PGADMIN_CONFIG_SERVER_MODE: 'False'
  PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

# Admin panel configuration
x-admin-config: &admin-config
  ADMIN_PORT: ${ADMIN_PORT:-8080}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SESSION_SECRET: ${SESSION_SECRET:-super_secret_key}
  ALLOWED_IPS: ${ALLOWED_IPS:-127.0.0.1,::1}
  DISABLE_IP_FILTERS: ${DISABLE_IP_FILTERS:-true}

services:
  postgres:
    image: postgres:15-alpine
    container_name: roulette-postgres
    environment:
      <<: *postgres-env
    volumes:
      - ./shared-data/postgresql:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-roulette}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *infrastructure-logging

  pgadmin:
    image: dpage/pgadmin4
    container_name: roulette-pgadmin
    environment:
      <<: *pgadmin-config
    volumes:
      - ./shared-data/pgadmin:/var/lib/pgadmin
      - "./pgadmin4.config.json:/pgadmin4/servers.json"
    ports:
      - "8181:80"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "none"

  redis:
    image: redis:7-alpine
    container_name: roulette-redis
    environment:
      <<: *redis-env
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - ./shared-data/redis:/data
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *infrastructure-logging

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: roulette-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:${REDIS_DB:-0}:${REDIS_PASSWORD:-redis123}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin}
      URL_PREFIX: /redis
    ports:
      - "8282:8081"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "none"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: roulette-rabbitmq
    ports:
      # - "5672:5672"
      - "15672:15672"
    volumes:
      - ./shared-data/rabbitmq:/var/lib/rabbitmq
    environment:
      <<: *rabbitmq-env
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *infrastructure-logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roulette-bot
    command: ./roulette-bot
    environment:
      <<: [*database-config, *rabbitmq-config, *telegram-config, *payment-config, *redis-config]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  rotator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roulette-rotator
    command: ./roulette-rotator
    environment:
      <<: [*database-config, *rabbitmq-config, *redis-config]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roulette-admin
    command: ./roulette-admin
    environment:
      <<: [*database-config, *telegram-config, *admin-config, *payment-config, *redis-config]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
