# Default logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-infrastructure-logging: &infrastructure-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Database configuration
x-database-config: &database-config
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roulette}?sslmode=disable

# RabbitMQ configuration
x-rabbitmq-config: &rabbitmq-config
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/

# Redis configuration
x-redis-config: &redis-config
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/${REDIS_DB:-0}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
  REDIS_DB: ${REDIS_DB:-0}

# Telegram configuration
x-telegram-config: &telegram-config
  TELEGRAM_API_URL: ${TELEGRAM_API_URL}
  TELEGRAM_TEST_MODE: ${TELEGRAM_TEST_MODE}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
  TELEGRAM_NAME: ${TELEGRAM_NAME}
  TELEGRAM_RESERVE_CHANNEL_ID: ${TELEGRAM_RESERVE_CHANNEL_ID}

# Payment configuration
x-payment-config: &payment-config
  DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-mock}
  OXAPAY_API_KEY: ${OXAPAY_API_KEY}

# PostgreSQL environment variables
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-roulette}

# RabbitMQ environment variables
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

# Redis environment variables
x-redis-env: &redis-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}

# PgAdmin configuration
x-pgadmin-config: &pgadmin-config
  SCRIPT_NAME: /pgadmin
  PGADMIN_PORT: 80
  PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-postgres@postgres.com}
  PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-postgres}
  PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
  PGADMIN_CONFIG_SERVER_MODE: "False"
  PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

# Admin panel configuration
x-admin-config: &admin-config
  ADMIN_PORT: ${ADMIN_PORT:-8080}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SESSION_SECRET: ${SESSION_SECRET:-super_secret_key}
  ALLOWED_IPS: ${ALLOWED_IPS:-127.0.0.1,::1}
  DISABLE_IP_FILTERS: ${DISABLE_IP_FILTERS:-true}

# Grafana configuration
x-grafana-config: &grafana-config
  GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
  GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_SERVER_ROOT_URL: /grafana/
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  GF_LOG_LEVEL: error
  GF_DATABASE_QUERY_TIMEOUT: 60s
  GF_DATABASE_CONNECTION_MAX_IDLE_TIME: 60s

services:
  postgres:
    image: postgres:15-alpine
    container_name: roulette-postgres
    environment:
      <<: *postgres-env
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./shared-data/postgresql:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
        reservations:
          memory: 4G
          cpus: "2"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-roulette}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *infrastructure-logging

  # Сервис для миграций - запускается каждый раз
  migrations:
    image: migrate/migrate:v4.16.2
    container_name: roulette-migrations
    volumes:
      - ./migrations:/migrations:ro
    environment:
      <<: *database-config
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roulette}?sslmode=disable",
        "-verbose",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no" # Запускается один раз при старте
    logging: *infrastructure-logging

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4
    container_name: roulette-pgadmin
    environment:
      <<: *pgadmin-config
    volumes:
      - ./shared-data/pgadmin:/var/lib/pgadmin
      - "./pgadmin4.config.json:/pgadmin4/servers.json"
    ports:
      - "127.0.0.1:8181:80"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: "none"

  redis:
    image: redis:7-alpine
    container_name: roulette-redis
    environment:
      <<: *redis-env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --appendonly yes
      --maxclients 10000
      --tcp-backlog 511
      --tcp-keepalive 300
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --stop-writes-on-bgsave-error no
      --rdbcompression yes
      --rdbchecksum yes
    volumes:
      - ./shared-data/redis:/data
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: "1"
        reservations:
          memory: 1G
          cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *infrastructure-logging

  redis-commander:
    profiles: ["tools"]
    image: rediscommander/redis-commander:latest
    container_name: roulette-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:${REDIS_DB:-0}:${REDIS_PASSWORD:-redis123}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin}
      URL_PREFIX: /redis
    ports:
      - "127.0.0.1:8282:8081"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.2"
    logging:
      driver: "none"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: roulette-rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - ./shared-data/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      <<: *rabbitmq-env
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *infrastructure-logging

  bot:
    image: ${IMAGE_NAME:-local/roulette-apps}:${IMAGE_TAG:-dev}
    container_name: roulette-bot
    command: ./roulette-bot
    environment:
      <<:
        [
          *database-config,
          *rabbitmq-config,
          *telegram-config,
          *payment-config,
          *redis-config,
        ]
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.2"
    restart: unless-stopped
    volumes:
      - ./shared-data/files/video:/files/video
    ports:
      - "127.0.0.1:9101:9101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  rotator:
    image: ${IMAGE_NAME:-local/roulette-apps}:${IMAGE_TAG:-dev}
    container_name: roulette-rotator
    command: ./roulette-rotator
    environment:
      <<: [*database-config, *rabbitmq-config, *redis-config]
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9102:9102"
    logging: *default-logging

  admin:
    image: ${IMAGE_NAME:-local/roulette-apps}:${IMAGE_TAG:-dev}
    container_name: roulette-admin
    command: ./roulette-admin
    environment:
      <<:
        [
          *database-config,
          *rabbitmq-config,
          *telegram-config,
          *admin-config,
          *payment-config,
          *redis-config,
        ]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9103:9103"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    restart: unless-stopped
    logging: *default-logging

  # Monitoring services
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.47.0
    container_name: roulette-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./shared-data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.external-url=http://localhost:9090/prometheus"
      - "--web.route-prefix=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    restart: unless-stopped
    logging: *infrastructure-logging

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.1.4
    container_name: roulette-grafana
    volumes:
      - ./shared-data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      <<: *grafana-config
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - postgres-exporter
      - rabbitmq-exporter
      - redis-exporter
      - node-exporter
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    logging: *infrastructure-logging

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: roulette-postgres-exporter
    env_file:
      - postgres_exporter.env
    ports:
      - "127.0.0.1:9187:9187"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    restart: unless-stopped
    depends_on:
      - postgres
    logging: *infrastructure-logging

  rabbitmq-exporter:
    profiles: ["monitoring"]
    image: kbudde/rabbitmq-exporter:1.0.0
    container_name: roulette-rabbitmq-exporter
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=${RABBITMQ_USER:-guest}
      - RABBIT_PASSWORD=${RABBITMQ_PASS:-guest}
    ports:
      - "127.0.0.1:9419:9419"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    restart: unless-stopped
    depends_on:
      - rabbitmq
    logging: *infrastructure-logging

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.6.1
    container_name: roulette-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    restart: unless-stopped
    logging: *infrastructure-logging

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.55.0
    container_name: roulette-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      REDIS_EXPORTER_LOG_FORMAT: txt
    ports:
      - "127.0.0.1:9121:9121"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    logging: *infrastructure-logging
