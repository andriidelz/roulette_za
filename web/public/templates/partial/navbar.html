{{define "public_navbar"}}
<!-- Навигационная панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="/static/public/img/logo.svg" alt="Sprut Games Logo" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2245%22%20fill%3D%22%23dc3545%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2257%22%20font-family%3D%22Arial%22%20font-size%3D%2220%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%3ER%3C%2Ftext%3E%3C%2Fsvg%3E'">
            SPRUT Games
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "home"}}active{{end}}" href="/">
                        <i class="bi bi-house"></i> {{ i18n .lang "nav_home" }}
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://t.me/socialroulette_bot" target="_blank">
                        <i class="bi bi-telegram"></i> {{ i18n .lang "nav_open_bot" }}
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "hashes"}}active{{end}}" href="/hashes">
                        <i class="bi bi-shield-check"></i> {{ i18n .lang "nav_results" }}
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "example"}}active{{end}}" href="/example">
                        <i class="bi bi-code-slash"></i> {{ i18n .lang "nav_example" }}
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "faq"}}active{{end}}" href="/faq">
                        <i class="bi bi-question-circle"></i> {{ i18n .lang "nav_faq" }}
                    </a>
                </li>
            </ul>
        </div>
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle bg-transparent mx-1" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="lang-flag bi bi-globe"></span>
            </button>
            <ul class="dropdown-menu bg-dark px-1 py-2 start-50 translate-middle-x" style="min-width: auto;">
                <li data-lang="en">
                    <a class="dropdown-item lang-link" href_="/en/">
                        <span class="fi fi-gb"></span>
                    </a>
                </li>
                <li data-lang="uk">
                    <a class="dropdown-item lang-link" href_="/">
                        <span class="fi fi-ua"></span>
                    </a>
                </li>
            </ul>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
{{end}}
