{{define "public_header"}}
<!DOCTYPE html>
<html lang="{{ .lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>{{if .Title}}{{.Title}} | {{end}}Sprut Games</title>
    <meta
      name="description"
      content="{{if .Description}}{{.Description}}{{else}}Roulette Bot - Telegram-бот для игры в социальную рулетку с системой проверки честности и рейтингами.{{end}}"
    />

    <!-- Bootstrap и иконки -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/7.5.0/css/flag-icons.min.css" 
      integrity="sha512-+WVTaUIzUw5LFzqIqXOT3JVAc5SrMuvHm230I9QAZa6s+QRk8NDPswbHo2miIZj3yiFyV9lAgzO1wVrjdoO4tw==" 
      crossorigin="anonymous" 
      referrerpolicy="no-referrer" 
    />

    <link rel="shortcut icon" href="/static/public/favicon.ico" type="image/x-icon">

    <script type="text/javascript">
      window.lang = "{{ .lang }}";

      const i18nEncoded = "{{ .i18n }}";
      const bytes = Uint8Array.from(atob(i18nEncoded), (c) => c.charCodeAt(0));
      const decoder = new TextDecoder("utf-8");
      window.i18n = JSON.parse(decoder.decode(bytes));
    </script>

    <!-- Общие стили -->
    <link href="/static/css/common.css" rel="stylesheet" />

    <!-- Дополнительные стили -->
    {{if .cssFiles}}{{range .cssFiles}}
    <link href="/static/css/{{.}}" rel="stylesheet" />
    {{end}}{{end}}
  </head>
  <body>
    {{end}}
  </body>
</html>
