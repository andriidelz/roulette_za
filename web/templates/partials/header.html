{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ .title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        /* Десктопное боковое меню */
        .sidebar {
            width: 250px;
            min-height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            padding-top: 20px;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            z-index: 1000;
        }
        
        .sidebar .nav-link {
            color: #212529;
            padding: 0.5rem 1rem;
            margin-bottom: 0.25rem;
        }
        
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
            border-radius: 0.25rem;
        }
        
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
            color: #212529;
            border-radius: 0.25rem;
        }
        
        .sidebar .nav-link.active:hover {
            background-color: #0d6efd;
            color: #fff;
        }
        
        /* Основной контент */
        .main-content {
            margin-left: 250px;
            padding: 80px 20px 20px;
        }
        
        /* Мобильные стили */
        @media (max-width: 991.98px) {
            .sidebar {
                display: none;
            }
            
            .main-content {
                margin-left: 0;
                padding: 70px 15px 15px;
            }
            
            /* Сжимаем заголовки */
            h1 {
                font-size: 1.75rem;
            }
            
            h5 {
                font-size: 1.1rem;
            }
            
            /* Боковое мобильное меню */
            .offcanvas {
                width: 80%;
                max-width: 300px;
            }
            
            /* Сжимаем кнопки */
            .btn-sm {
                padding: 0.25rem 0.5rem;
                font-size: 0.75rem;
            }
            
            /* Улучшаем отображение таблиц */
            .table {
                font-size: 0.85rem;
            }
            
            /* Оптимизация групп кнопок */
            .btn-group {
                flex-wrap: wrap;
            }
            
            /* Полноширинные формы поиска */
            .d-flex form {
                width: 100%;
            }
            
            /* Адаптивное расположение элементов заголовка карточки */
            .card-header .d-flex.justify-content-between {
                flex-direction: column;
                align-items: flex-start !important;
            }
            
            .card-header .d-flex.justify-content-between > * {
                margin-bottom: 0.5rem;
                width: 100%;
            }
            
            /* Уменьшаем отступы для экономии места */
            .container-fluid {
                padding-left: 10px;
                padding-right: 10px;
            }
            
            .row {
                margin-left: -10px;
                margin-right: -10px;
            }
            
            .col, .col-1, .col-2, .col-3, .col-4, .col-5, .col-6, 
            .col-7, .col-8, .col-9, .col-10, .col-11, .col-12,
            .col-sm, .col-md, .col-lg, .col-xl {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
        
        /* Очень маленькие устройства */
        @media (max-width: 575.98px) {
            /* Ещё более компактные стили */
            .table {
                font-size: 0.75rem;
            }
            
            .card-body {
                padding: 0.75rem;
            }
            
            /* Скрытие некритичных колонок в таблицах */
            .d-none-xs {
                display: none !important;
            }
            
            /* Вкладки без текста, только иконки */
            .nav-tabs .nav-link {
                padding: 0.4rem 0.5rem;
            }
            
            /* Оптимизированный footer */
            footer {
                font-size: 0.8rem;
                padding: 0.5rem !important;
            }
        }
        
        /* Стили для страницы хешей */
        .hash-label {
            display: inline-block;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .hash-label-full {
            max-width: 100%;
            word-break: break-all;
        }
        
        .color-indicator {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
        
        .color-red {
            background-color: #dc3545;
        }
        
        .color-black {
            background-color: #212529;
        }
        
        .color-green {
            background-color: #198754;
        }
        
        .refresh-button.spinning .bi-arrow-clockwise {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Стили для мобильного бокового меню */
        .offcanvas-body .nav-link {
            border-radius: 0;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .offcanvas-body .nav-link.active {
            border-left-color: #0d6efd;
            background-color: rgba(13, 110, 253, 0.1);
        }
        
        .offcanvas-body .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 767.98px) {
            .btn {
                padding-top: 0.625rem;
                padding-bottom: 0.625rem;
                font-size: 1rem;
            }
        }
        @media (min-width: 768px) {
            .unban-user-btn,
            .ban-user-btn {
                max-width: 220px;
            }
            .btn-outline-secondary {
                max-width: 180px;
            }
        }
    </style>
    {{block "additionalStyles" .}}{{end}}
</head>
<body>
{{end}}
