<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .sidebar {
            width: 250px;
            min-height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            padding-top: 20px;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #212529;
            padding: 0.5rem 1rem;
            margin-bottom: 0.25rem;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
            border-radius: 0.25rem;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
            color: #212529;
            border-radius: 0.25rem;
        }
        .sidebar .nav-link.active:hover {
            background-color: #0d6efd;
            color: #fff;
        }
        .main-content {
            margin-left: 250px;
            padding: 80px 20px 20px;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: static;
                min-height: auto;
                border-right: none;
                padding-top: 10px;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">Адмін-панель Рулетки</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Вихід</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex">
        <div class="sidebar d-none d-lg-block">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "dashboard"}}active{{end}}" href="/admin">
                        <i class="bi bi-speedometer2"></i> Головна
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "users"}}active{{end}}" href="/admin/users">
                        <i class="bi bi-people"></i> Користувачі
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "stats"}}active{{end}}" href="/admin/stats">
                        <i class="bi bi-bar-chart"></i> Статистика
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "ratings"}}active{{end}}" href="/admin/ratings">
                        <i class="bi bi-trophy"></i> Рейтинги
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "withdrawals"}}active{{end}}" href="/admin/withdrawals">
                        <i class="bi bi-cash-coin"></i> Виведення коштів
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "hashes"}}active{{end}}" href="/admin/hashes">
                        <i class="bi bi-hash"></i> Хеші рулетки
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .activeTab "settings"}}active{{end}}" href="/admin/settings">
                        <i class="bi bi-gear"></i> Налаштування
                    </a>
                </li>
            </ul>
        </div>

        <main class="main-content flex-grow-1">
            <div class="container-fluid">
                {{ if .error }}
                <div class="alert alert-danger" role="alert">
                    {{ .error }}
                </div>
                {{ end }}
                
                {{ template "content" . }}
            </div>
        </main>
    </div>

    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">© 2025 Телеграм-бот "Рулетка"</p>
        </div>
    </footer>
</body>
</html>
