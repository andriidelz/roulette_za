# FAQ section
faq_question_1: "Як я можу бути впевнений, що результати не підтасовані?"
faq_answer_1_p1: "Завдяки системі попереднього хешування, результат кожного раунду визначається заздалегідь і не може бути змінено після початку приймання ставок. Хеш публікується до початку раунду, а після завершення ти можеш перевірити його відповідність з відкритими даними."
faq_answer_1_p2: "Криптографічний алгоритм SHA-256 математично гарантує, що неможливо підібрати іншу комбінацію номера та солі, яка дала б такий же хеш."

faq_question_2: 'Що таке "сіль" і навіщо вона потрібна?'
faq_answer_2_p1: "Сіль — це випадковий рядок символів, який додається до числа перед обчисленням хешу. Вона потрібна для того, щоб не можна було заздалегідь підготувати таблицю відповідності всіх можливих чисел (від 0 до 36) їх хешам."
faq_answer_2_p2: "Без солі зловмисник міг би просто подивитися в таку таблицю і дізнатися, яке число випаде. Сіль додає непередбачуваність і гарантує унікальність хешу для кожного раунду, навіть якщо випадають однакові числа."

faq_question_3: "Які інструменти я можу використовувати для перевірки?"
faq_answer_3: "Ти можеш використовувати:"
verification_tools_1: "Вбудовану форму перевірки на цій сторінці"
verification_tools_2: "Онлайн-калькулятори SHA-256 (наприклад, Online SHA-256)"
verification_tools_3: "Командний рядок на Linux/Mac: echo -n '5:a1b2c3d4e5f6' | sha256sum"
verification_tools_4: "Будь-яку мову програмування з бібліотекою для обчислення SHA-256 хешів"
format_reminder: "Не забудь використовувати формат число:сіль без пробілів і інших символів."

