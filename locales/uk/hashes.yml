# Fair game system explanation
fair_system_title: "Як працює система чесної гри"
generation_step: "Генерація хешу"
generation_desc: 'Перед початком раунду система генерує випадкове число від 0 до 36 та унікальну криптографічну сіль. Потім обчислюється SHA-256 хеш від рядка "число:сіль".'
publication_step: "Публікація хешу"
publication_desc: "Хеш публікується до того, як гравці почнуть робити ставки. Це гарантує, що результат попередньо визначено і не може бути змінено після розміщення ставок."
reveal_step: "Розкриття результату"
reveal_desc: "Після завершення раунду система розкриває використане число та сіль. Будь-хто може перевірити, чи відповідає опублікований заздалегідь хеш цим даним."

