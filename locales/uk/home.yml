# Feature cards
fund_title: "Щотижневий фонд — 1 000$"
fund_desc: "Кожен гравець має шанс потрапити до тижневого топу та отримати частку з призового фонду в 1 000$. З початком нового тижня виплату можна вивести на особистий криптогаманець."
free_title: "Повністю безкоштовна гра"
free_desc: "У грі немає жодних оплат чи депозитів. Кожен гравець щодня отримує безкоштовні ставки для вгадування кольору, який випаде на рулетці, та підняття своєї позиції у рейтингу."
withdrawal_title: "Моментальне виведення коштів"
withdrawal_desc: "Гра надає можливість миттєвого виведення винагороди після зарахування — без airdrop-ів та довгих очікувань. Грошове нарахування відбувається щопонеділка, яке одразу можна вивести на свій криптогаманець."
fairness_title: "Гра без обману"
fairness_desc: "Кожне вгадування кольору на рулетці перевіряється незалежним тестом криптографічного хешу SHA-256. Це гарантує прозорість системи та виключає можливість шахрайства."
verification_title: "Без верифікації"
verification_desc: "Гра проходить прямо в Telegram. Щоб розпочати, потрібно лише 20 секунд: підтвердити повноліття, обрати країну, вказати нікнейм та підписатися на канал бота. Це всі умови для старту."
no_ads_title: "Ніякої реклами"
no_ads_desc: "Тобі не доведеться «платити» за безкоштовну гру частим переглядом довгої реклами. Все створено для занурення в ігровий процес та концентрації на виграші."

