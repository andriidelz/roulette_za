how_hash_verification_works: "Як працює перевірка хешу?"

step_data_generation: "Генерація даних"
step_data_desc: 'Система створює рядок у форматі "число:сіль" (наприклад, "5:a1b2c3d4e5f6"). Тут число – це результат раунду рулетки (від 0 до 36), а сіль – випадковий рядок символів.'

step_hash_calculation: "Обчислення хешу"
step_hash_desc: "Цей рядок перетворюється на масив байтів, до якого застосовується алгоритм SHA-256. Результатом є 64-символьний рядок у шістнадцятковому форматі."

step_publication_verification: "Публікація та перевірка"
step_publication_desc: "Перед початком раунду публікується лише хеш. Після завершення раунду розкриваються число та сіль. Ти можеш самостійно обчислити хеш та переконатися, що він відповідає опублікованому."

why_guarantee_fairness: "Чому це гарантує чесність?"
fairness_explanation: 'Оскільки хеш публікується до початку прийому ставок, а результат та сіль розкриваються після закінчення раунду, система не може змінити результат після того, як гравці зробили свої ставки. Криптографічний алгоритм SHA-256 гарантує, що неможливо знайти іншу пару "число: сіль", яка дала б такий самий хеш.'
