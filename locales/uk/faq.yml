# Rules
rules: "Які правила гри?"
rules_start_title: "🏁 Початок"
rules_start_text: "Кожен гравець має право на безкоштовну участь та починає новий календарний тиждень із можливістю зробити 2880 ставок кожного дня. Безкоштовні ставки автоматично оновлюються о 00:00 (за часом UTC+0)."
rules_process_title: "⚙️ Процес гри"
rules_process_text: 'У розділі «Грати» кожні 15 секунд гравець може зробити ставку, обравши один з кольорів секторів: червоне, чорне або Zero. Система випадковим чином визначає переможний колір сектора (визначаючи конкретний номер сектора згідно европейської схеми рулетки) та нараховує відповідні бали учаснику.'
rules_zero_title: "⚠️ Особливості ставки на Zero"
rules_zero_text: "Можливість робити ставки на Zero відкривається лише після того, як гравець виконає 100 спроб вгадування на червоне чи чорне протягом одного дня. Це правило діє щодня. Якщо ставка на Zero зроблена до її активації, вона автоматично вважається програшною."
rules_points_title: "🧮 Система нарахування балів"
rules_points_text_1: "🔴 Червоне — 1 бал"
rules_points_text_2: "⚫ Чорне — 1 бал"
rules_points_text_3: "🟢 Zero — 10 балів"
rules_rating_title: "🔝 Рейтинг та розподіл призового фонду"
rules_rating_text: "Усі набрані бали за календарний тиждень підсумовуються та формують загальний рейтинг. Позиція гравця в рейтингу визначає коефіцієнт розрахунку та частку в щотижневому призовому пулі."

# Safety
safety: "Наскільки я можу довіряти цьому боту?"
safety_text: "🛡️ Ми зробили продукт максимально прозорим для користувачів. Дотримуємось принципів чесної гри, аби ви були впевнені у нашій відкритості та надійності."
safety_description: "👇 Наша рулетка використовує криптографічну верифікацію для забезпечення чесності результатів:"
safety_description_step_1: "1️⃣ Перед кожним раундом публікується хеш результату"
safety_description_step_2: "2️⃣ Результат не може бути змінений після початку раунду"
safety_description_step_3: "3️⃣ Після раунду розкриваються число та сіль"
safety_description_step_4: "4️⃣ Гравці можуть перевірити, що хеш відповідає результату"
safety_description_step_5: "🌐 Розділ для перевірки хешу SHA-256: https://games.sprut.net/hashes"
safety_steps_title: "👇 Кроки перевірки:"
safety_steps_text_1: "Візьміть число та сіль, надані після раунду"
safety_steps_text_2: "Створіть рядок: [число]:[сіль]"
safety_steps_text_3: "Обчисліть хеш SHA-256"
safety_steps_text_4: "Порівняйте з хешем, наданим на початку раунду"
safety_summary: "Це забезпечує 100% чесні та непередбачувані результати."

# Rewards
rewards: "Як розподіляються нагороди?"
rewards_text: "💰 Нагороди в Sprut Black&Red розподіляються відповідно рейтингу учасників гри. Щотижневий рейтинг формується на основі кількості вдалих вгадувань кольору сектору. Усі дії гравців зберігаються в статистиці."
rewards_distribution_title: "💵 Розподіл призового фонду."
rewards_distribution_text: "Призовий фонд ділиться щопонеділка (за часом UTC+0) пропорційно кількості вдалих вгадувань."
rewards_example: "Умовний приклад (якщо фонд = $1 000):"
rewards_example_text_1: "🔹 100 топ-гравців разом зробили 1000 вгадувань → ціна 1 вгадування = $1."
rewards_example_text_2: "🔹 Якщо гравець вгадав 100 разів — він отримає $100."
rewards_example_text_3: "🔹 Якщо вгадав 10 разів — отримає $10."
rewards_identical_results: "⚖️ У разі однакових результатів у рейтингу"
rewards_identical_results_text: "Якщо кілька гравців мають однакову кількість вгадувань, вище місце займає той, хто отримав більше балів за меншу кількість спроб (чия ефективність вгадування вища)."
rewards_payments_title: "💳 Виплати"
rewards_payments_text: "Винагорода автоматично зараховується на внутрішній рахунок. Виведення можливе після створення запиту гравцем."

# Payments
payments: "Як виплачуються кошти?"
payments_accrual_title: "🧮 Нарахування"
payments_accrual_text: "Нагороди автоматично зараховуються щопонеділка після завершення календарного тижня на внутрішній баланс. Перевірити баланс можна у меню: «Акаунт» ➡️ «Баланс»."
payments_withdrawal_title: "💳 Виведення коштів"
payments_withdrawal_text: "Якщо нагороди на балансі перевищують 10$, їх можна вивести на особистий криптогаманець. Для цього у меню потрібно натиснути: «Акаунт» ➡️ «Виведення» ➡️ «Запросити виведення». Далі гравець підтверджує вже доданий гаманець або може додати новий."
payments_terms_title: "⚡ Терміни виплат"
payments_terms_text: "Кошти надходять протягом 24 годин після запиту. Зазвичай, це відбувається швидше."
payments_conditions_title: "📌 Обов’язкові умови:"
payments_conditions_text_1: "Виведення виконується лише в стейблкоїні USDT. Переказ здійснюється в мережі TRC20. Мінімальна сума для виводу – 10$."
payments_conditions_text_2: "Комісія за кожний вивід - 1$, і списується автоматично з суми виведення"

