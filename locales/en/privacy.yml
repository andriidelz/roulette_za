privacy_h1: "📜 Privacy Policy for the SPRUT Black & Red Telegram Bot (SPRUT Games)"
version: "Version:"
version_number: "1.0"
effective_date: "Effective Date:"
contact_privacy: "Contact for privacy inquiries:"
contact_support: "contact support"
agreement: "By using this bot, you agree to this Policy. If you disagree, stop using it and submit a request for data deletion."
data_collection: "1. What Data We Collect"
data_processing_intro: "We only process the data necessary for the bot to function:"
telegram_ids: "Telegram Identifiers: Telegram ID, username (@username), display name."
profile_settings: "Profile Settings: interface language, chosen public nickname in the bot, other selected parameters."
country: "Country: specified by you manually in the bot."
payments_and_wallets: "Payments and Crypto Wallets: cryptocurrency wallet address (for accruals/payouts), transaction amounts and technical metadata."
gaming_data: "Gaming Data: statistics, bet/round history, ranking position, technical event logs."
technical_logs: "Technical Logs: date/time of actions in the bot, Telegram client version, IP/legally permissible network metadata from our infrastructure (if required for security)."
data_sources: "Data Sources: directly from you in the bot and via the Telegram Bot API. We do not collect contact books, geolocation, or any other information."
data_usage: "2. How We Use Your Data (Processing Purposes)"
provide_services: "Providing gaming services and bot functions."
calculate_ratings: "Calculating ratings and distributing prizes/rewards."
process_payments: "Processing payments (including accruals to the specified crypto wallet)."
ensure_security: "Ensuring Security: preventing fraud, abuse, botnet activity, spoofing, account duplication."
improve_service: "Improving Service: anonymized/aggregated analytics of feature usage."
legal_obligations: "Fulfilling Legal Obligations (if necessary)."
legal_bases: "3. Legal Bases for Processing"
user_request: "Providing bot functions exclusively at the user's request."
legitimate_interest: "Legitimate Interest (fraud protection, service support and development)."
consent: "Consent (for specific options, if we explicitly ask for it — it can be revoked at any time)."
data_protection: "4. Data Protection"
security_measures: "We apply industry-standard security measures: encryption in transit (TLS), access control, audit logs, environment isolation."
access_control: "Only authorized employees/contractors have access to data based on the principle of least privilege."
internal_audits: "We conduct periodic internal security audits."
data_transfer: "5. Transfer to Third Parties"
no_data_sale: "We do not sell or transfer your personal data to third-party companies for their purposes, except in cases where you have expressed a desire to transfer your data as part of cross-platform or partner activities. Data may be processed by processors exclusively on our behalf:"
hosting_providers: "Hosting/Infrastructure (servers/databases)."
payment_providers: "Payment and Blockchain Providers/Explorers (for verifying transaction status)."
anonymized_analytics: "Analytics in anonymized/aggregated form."
data_processing_policy: "Data processing is performed solely within the privacy policies of the respective providers or services."
international_transfer: "6. International Transfer"
data_protection_guarantees: "Our servers or contractors may be located outside of your country. All necessary guarantees and data protection standards are provided and regulated by the privacy policies of the respective service providers."
storage_periods: "7. Storage Periods"
gaming_data_storage: "Gaming Data and Event Logs: stored for the entire duration of account activity, unless otherwise stated."
payment_records_storage: "Payment Records: for the period until the user changes or deletes them, but no longer than necessary for the bot's functionality."
anonymized_analytics_storage: "Anonymized Analytics: may be stored longer as it does not identify an individual."
your_rights: "8. Your Rights"
rights_summary: "You have the right (within the applicable law):"
data_access: "Access to your data."
correction: "Correction of inaccurate or incomplete data."
deletion: "Deletion (right to be forgotten) except for data we are legally required to retain."
restriction: "Restriction or objection to processing in certain cases."
data_portability: "Data Portability (where technically feasible)."
complaint: "Complaint to the data protection regulator."
how_to_request: "How to Submit a Request: "
confirmation: "(we will confirm the action and notify you of the result)."
telegram_specifics: "9. Telegram Specifics"
telegram_controller: "Telegram is a separate data controller regarding your account. We do not control how Telegram processes your personal data. Please refer to Telegram's Privacy Policy in their official sources."
minimum_age: "10. Minimum Age"
age_restrictions: "The service is intended only for users aged 18 and over. If we become aware of a younger age, we will block access and delete the data."
automated_decisions: "11. Automated Decisions"
anti_fraud_checks: "We may use automated checks for anti-fraud purposes and for generating ratings. These do not lead to legally significant decisions without human involvement."
policy_changes: "12. Policy Changes"
policy_updates: "We may update this Policy from time to time. The current version is published in the bot (section /privacy). Significant changes will be communicated additionally."
contacts: "13. Contacts"
contact_privacy_info: "For privacy questions "
response_time: "We will respond within a period, usually up to 30 days."