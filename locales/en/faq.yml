# Rules
rules: "What are the game rules?"
rules_start_title: "🏁 Start"
rules_start_text: "Every player is entitled to free participation and starts a new calendar week with the ability to make 2880 bets every day. Free bets are automatically updated at 00:00 (UTC+0 time)."
rules_process_title: "⚙️ Game Process"
rules_process_text: 'In the "Play" section, every 15 seconds a player can place a bet by choosing one of the sector colors: red, black, or Zero. The system randomly determines the winning sector color (by determining a specific sector number according to the European roulette scheme) and awards corresponding points to the participant.'
rules_zero_title: "⚠️ Features of betting on Zero"
rules_zero_text: "The ability to place bets on Zero opens only after the player makes 100 guessing attempts on red or black within one day. This rule applies daily. If a bet on Zero is made before its activation, it is automatically considered a loss."
rules_points_title: "🧮 Points System"
rules_points_text_1: "🔴 Red — 1 point"
rules_points_text_2: "⚫ Black — 1 point"
rules_points_text_3: "🟢 Zero — 10 points"
rules_rating_title: "🔝 Rating and Prize Pool Distribution"
rules_rating_text: "All points earned during the calendar week are summed up and form the overall rating. The player's position in the rating determines the calculation coefficient and share in the weekly prize pool."

# Safety
safety: "How much can I trust this bot?"
safety_text: "🛡️ We have made the product as transparent as possible for users. We adhere to the principles of fair play so that you can be confident in our openness and reliability."
safety_description: "👇 Our roulette uses cryptographic verification to ensure the fairness of results:"
safety_description_step_1: "1️⃣ The result hash is published before each round"
safety_description_step_2: "2️⃣ The result cannot be changed after the round starts"
safety_description_step_3: "3️⃣ After the round, the number and salt are revealed"
safety_description_step_4: "4️⃣ Players can verify that the hash matches the result"
safety_description_step_5: "🌐 Section for SHA-256 hash verification: https://games.sprut.net/hashes"
safety_steps_title: "👇 Verification Steps:"
safety_steps_text_1: "Take the number and salt provided after the round"
safety_steps_text_2: 'Create a string: [number]:[salt]'
safety_steps_text_3: "Compute the SHA-256 hash"
safety_steps_text_4: "Compare with the hash provided at the beginning of the round"
safety_summary: "This ensures 100% fair and unpredictable results."

# Rewards
rewards: "How are rewards distributed?"
rewards_text: "💰 Rewards in Sprut Black&Red are distributed according to the players' game ratings. The weekly rating is formed based on the number of successful sector color guesses. All player actions are saved in statistics."
rewards_distribution_title: "💵 Prize Pool Distribution"
rewards_distribution_text: "The prize pool is divided on Mondays (UTC+0 time) proportionally to the number of successful guesses."
rewards_example: "Example (if the prize pool = $1,000):"
rewards_example_text_1: "🔹 Top 100 players together made 1000 guesses → price per 1 guess = $1."
rewards_example_text_2: "🔹 If a player guesses 100 times — they receive $100."
rewards_example_text_3: "🔹 If a player guesses 10 times — they receive $10."
rewards_identical_results: "⚖️ In case of identical results in the ranking"
rewards_identical_results_text: "If several players have the same number of guesses, the higher place is taken by the one who earned more points in fewer attempts (whose guessing efficiency is higher)."
rewards_payments_title: "💳 Payments"
rewards_payments_text: "The reward is automatically credited to your internal account. Withdrawal becomes available once you submit a request."

# Payments
payments: "How are funds paid out?"
payments_accrual_title: "🧮 Accrual"
payments_accrual_text: "Rewards are automatically credited on Mondays after the end of the calendar week to the internal balance. You can check the balance in the menu: «Account» ➡️ «Balance»."
payments_withdrawal_title: "💳 Withdrawal"
payments_withdrawal_text: "If rewards on the balance exceed $10, they can be withdrawn to a personal crypto wallet. To do this, in the menu, click: «Account» ➡️ «Withdraw» ➡️ «Request Withdrawal». Then the player confirms an already added wallet or can add a new one."
payments_terms_title: "⚡ Payout Terms"
payments_terms_text: "Funds are processed within 24 hours after the request — usually much faster."
payments_conditions_title: "📌 Mandatory Conditions:"
payments_conditions_text_1: "Withdrawal is made only in USDT stablecoin. The transfer is made in the TRC20 network. The minimum withdrawal amount is $10."
payments_conditions_text_2: "The withdrawal fee is $1 and is automatically deducted from the payout amount."

# Support section
support_title: "I have a problem or a question not listed here. What should I do?"
support_answer: "ℹ️ If you have any questions not covered in the FAQ, or if you’ve encountered a problem or have a suggestion — you can always contact our support team:"
contact_method1: "Use the /contact command in the bot and describe your problem"
contact_method2: "Write to our support team on Telegram: @sprutgames_supportbot."
support_response_time: "⏰ We usually reply within 24 hours. Your feedback is very important to us, and we are constantly improving our service."
support_rules: "When sending a message to support, try to describe your request in as much detail as possible. A clear, detailed, and understandable description will help resolve the issue faster without unnecessary clarifications. Thank you for your understanding!"