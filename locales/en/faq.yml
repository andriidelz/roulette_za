# What is Roulette Bot
what_is_roulette_bot: "What is the Sprut Black&Red bot?"
roulette_bot_answer: "🐙 Sprut Black&Red is a Telegram bot that allows users to play a simplified version of roulette and win a share of the weekly prize pool, which is currently $1,000."
main_features: "Sprut Black&Red has unique advantages:"
feature_1: "Weekly prize pool of $1,000;"
feature_2: "No verification required;"
feature_3: "No participation fees or deposits of any kind;"
feature_4: "Instant reward withdrawal — no airdrops or long waiting times;"
feature_5: "Transparent drawing system with the ability to independently verify each guess."

