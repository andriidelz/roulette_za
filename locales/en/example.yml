how_hash_verification_works: "How does hash verification work?"

step_data_generation: "Data Generation"
step_data_desc: 'The system creates a string in the format "number:salt" (e.g., "5:a1b2c3d4e5f6"). Here, the number is the roulette round result (from 0 to 36), and the salt is a random string of characters.'

step_hash_calculation: "Hash Calculation"
step_hash_desc: "This string is converted into a byte array, to which the SHA-256 algorithm is applied. The result is a 64-character string in hexadecimal format."

step_publication_verification: "Publication and Verification"
step_publication_desc: "Only the hash is published before the round starts. After the round ends, the number and salt are revealed. You can independently compute the hash and verify that it matches the published one."

why_guarantee_fairness: "Why does this guarantee fairness?"
fairness_explanation: 'Since the hash is published before betting begins, and the result and salt are revealed after the round ends, the system cannot change the outcome after players have placed their bets. The SHA-256 cryptographic algorithm guarantees that it is impossible to find another "number:salt" pair that would produce the same hash.'