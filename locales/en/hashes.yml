# FAQ section
faq_question_1: "How can I be sure the results are not rigged?"
faq_answer_1_p1: "Thanks to the pre-hashing system, the result of each round is determined in advance and cannot be changed after betting starts. The hash is published before the round starts, and after completion, you can verify its correspondence with the open data."
faq_answer_1_p2: "The SHA-256 cryptographic algorithm mathematically guarantees that it is impossible to find another number and salt combination that would produce the same hash."

faq_question_2: 'What is "salt" and why is it needed?'
faq_answer_2_p1: "Salt is a random string of characters added to the number before calculating the hash. It is needed so that one cannot prepare in advance a table of correspondences of all possible numbers (from 0 to 36) to their hashes."
faq_answer_2_p2: "Without salt, a malicious actor could simply look in such a table and find out which number will come up. Salt adds unpredictability and guarantees the uniqueness of the hash for each round, even if identical numbers are drawn."

faq_question_3: "What tools can I use for verification?"
faq_answer_3: "You can use:"
verification_tools_1: "The built-in verification form on this page"
verification_tools_2: "Online SHA-256 calculators (e.g., Online SHA-256)"
verification_tools_3: 'Command line on Linux/Mac: echo -n "5:a1b2c3d4e5f6" | sha256sum'
verification_tools_4: "Any programming language with a library for computing SHA-256 hashes"
format_reminder: "Don't forget to use the number:salt format without spaces and other characters."

