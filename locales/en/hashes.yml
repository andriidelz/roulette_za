# Fair game system explanation
fair_system_title: "How the fair game system works"
generation_step: "Hash Generation"
generation_desc: 'Before the round starts, the system generates a random number from 0 to 36 and a unique cryptographic salt. Then the SHA-256 hash of the string "number:salt" is calculated.'
publication_step: "Hash Publication"
publication_desc: "The hash is published before players start placing bets. This guarantees that the result is predetermined and cannot be changed after bets are placed."
