how_hash_verification_works: "Как работает проверка хеша?"

step_data_generation: "Генерация данных"
step_data_desc: 'Система создаёт строку в формате "число:соль" (например, "5:a1b2c3d4e5f6"). Здесь число — это результат раунда рулетки (от 0 до 36), а соль — случайная строка символов.'

step_hash_calculation: "Вычисление хеша"
step_hash_desc: "Эта строка преобразуется в массив байтов, к которому применяется алгоритм SHA-256. Результатом является 64-символьная строка в шестнадцатеричном формате."

step_publication_verification: "Публикация и проверка"
step_publication_desc: "Перед началом раунда публикуется только хеш. После завершения раунда раскрываются число и соль. Ты можешь самостоятельно вычислить хеш и убедиться, что он соответствует опубликованному."

why_guarantee_fairness: "Почему это гарантирует честность?"
fairness_explanation: 'Поскольку хеш публикуется до начала приёма ставок, а результат и соль раскрываются после окончания раунда, система не может изменить результат после того, как игроки сделали свои ставки. Криптографический алгоритм SHA-256 гарантирует, что невозможно найти другую пару "число:соль", которая дала бы такой же хеш.'
