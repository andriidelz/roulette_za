# FAQ section
faq_question_1: "Как я могу быть уверен, что результаты не подтасованы?"
faq_answer_1_p1: "Благодаря системе предварительного хеширования, результат каждого раунда определяется заранее и не может быть изменен после начала приема ставок. Хеш публикуется до начала раунда, а после завершения ты можешь проверить, соответствует ли он открытым данным."
faq_answer_1_p2: "Криптографический алгоритм SHA-256 математически гарантирует, что невозможно подобрать другую комбинацию номера и соли, которая дала бы такой же хеш."

faq_question_2: 'Что такое "соль" и зачем она нужна?'
faq_answer_2_p1: "Соль — это случайная строка символов, которая добавляется к числу перед вычислением хеша. Она нужна для того, чтобы нельзя было заранее подготовить таблицу соответствия всех возможных чисел (от 0 до 36) их хешам."
faq_answer_2_p2: "Без соли злоумышленник мог бы просто посмотреть в такую таблицу и узнать, какое число выпадет. Соль добавляет непредсказуемость и гарантирует уникальность хеша для каждого раунда, даже если выпадают одинаковые числа."

faq_question_3: "Какие инструменты я могу использовать для проверки?"
faq_answer_3: "Ты можешь воспользоваться:"
