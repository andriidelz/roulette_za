# What is Roulette Bot
what_is_roulette_bot: "Что такое Roulette Bot?"
roulette_bot_answer: "Roulette Bot - это Telegram-бот, который позволяет пользователям играть в упрощенную версию рулетки. В нашей рулетке есть возможность делать ставки на красное, черное или зеро (0)."
main_features: "Основные особенности Roulette Bot:"
feature_1: "Упрощенная игра в рулетку с ставками на красное, черное или зеро"
feature_2: "Еженедельный рейтинг игроков с призовым фондом"
feature_3: "Супер-рейтинг на основе позиций в еженедельных рейтингах"
feature_4: "Поддержка нескольких языков (украинский, английский и русский)"
feature_5: "Прозрачная система проверки честности результатов"

