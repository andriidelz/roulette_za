# Rules
rules: "Какие правила игры?"
rules_start_title: "🏁 Начало"
rules_start_text: "Каждый игрок имеет право на бесплатное участие и начинает новую календарную неделю с возможностью сделать 2880 ставок каждый день. Бесплатные ставки автоматически обновляются в 00:00 (по времени UTC+0)."
rules_process_title: "⚙️ Процесс игры"
rules_process_text: 'В разделе «Играть» каждые 15 секунд игрок может сделать ставку, выбрав один из цветов секторов: красный, чёрный или Zero. Система случайным образом определяет выигрышный цвет сектора (определяя конкретный номер сектора по европейской схеме рулетки) и начисляет соответствующие баллы участнику.'
rules_zero_title: "⚠️ Особенности ставки на Zero"
rules_zero_text: "Возможность делать ставки на Zero открывается только после того, как игрок сделает 100 попыток угадывания на красное или чёрное в течение одного дня. Это правило действует ежедневно. Если ставка на Zero сделана до её активации, она автоматически считается проигрышной."
rules_points_title: "🧮 Система начисления баллов"
rules_points_text_1: "🔴 Красное — 1 балл"
rules_points_text_2: "⚫ Чёрное — 1 балл"
rules_points_text_3: "🟢 Zero — 10 баллов"
rules_rating_title: "🔝 Рейтинг и распределение призового фонда"
rules_rating_text: "Все набранные баллы за календарную неделю суммируются и формируют общий рейтинг. Позиция игрока в рейтинге определяет коэффициент расчета и долю в еженедельном призовом пуле."

# Safety
safety: "Насколько я могу доверять этому боту?"
safety_text: "🛡️ Мы сделали продукт максимально прозрачным для пользователей. Соблюдаем принципы честной игры, чтобы ты был уверен в нашей открытости и надежности."
safety_description: "👇 Наша рулетка использует криптографическую верификацию для обеспечения честности результатов:"
safety_description_step_1: "1️⃣ Перед каждым раундом публикуется хеш результата"
safety_description_step_2: "2️⃣ Результат не может быть изменен после начала раунда"
safety_description_step_3: "3️⃣ После раунда раскрываются число и соль"
safety_description_step_4: "4️⃣ Игроки могут проверить, что хеш соответствует результату"
safety_description_step_5: "🌐 Раздел для проверки хеша SHA-256: https://games.sprut.net/hashes"
safety_steps_title: "👇 Шаги проверки:"
safety_steps_text_1: "Возьми число и соль, предоставленные после раунда"
safety_steps_text_2: "Создай строку: [число]:[соль]"
safety_steps_text_3: "Вычисли хеш SHA-256"
safety_steps_text_4: "Сравни с хешем, предоставленным в начале раунда"
safety_summary: "Это обеспечивает 100% честные и непредсказуемые результаты."

# Rewards
rewards: "Как распределяются награды?"
rewards_text: "💰 Награды в Sprut Black&Red распределяются в соответствии с рейтингом участников игры. Еженедельный рейтинг формируется на основе количества удачных угадываний цвета сектора. Все действия игроков сохраняются в статистике."
rewards_distribution_title: "💵 Распределение призового фонда"
rewards_distribution_text: "Призовой фонд делится по понедельникам (по времени UTC+0) пропорционально количеству удачных угадываний."
rewards_example: "Условный пример (если фонд = 1 000$):"
rewards_example_text_1: "🔹 100 топ-игроков вместе сделали 1000 угадываний → цена 1 угадывания = 1$."
rewards_example_text_2: "🔹 Если игрок угадал 100 раз — он получит 100$."
rewards_example_text_3: "🔹 Если угадал 10 раз — получит 10$."
rewards_identical_results: "⚖️ В случае одинаковых результатов в рейтинге"
rewards_identical_results_text: "Если несколько игроков имеют одинаковое количество угадываний, более высокое место занимает тот, кто получил больше баллов за меньшее количество попыток (чья эффективность угадывания выше)."
rewards_payments_title: "💳 Выплаты"
rewards_payments_text: "Награда автоматически зачисляется на внутренний счёт. Вывод возможен после создания запроса игроком."

# Payments
payments: "Как выплачиваются средства?"
payments_accrual_title: "🧮 Начисление"
payments_accrual_text: "Награды автоматически зачисляются по понедельникам после завершения календарной недели на внутренний баланс. Проверить баланс можно в меню: «Аккаунт» ➡️ «Баланс»."
payments_withdrawal_title: "💳 Вывод средств"
payments_withdrawal_text: "Если награды на балансе превышают 10$, их можно вывести на личный криптокошелек. Для этого в меню нужно нажать: «Аккаунт» ➡️ «Вывод» ➡️ «Запросить вывод». Далее игрок подтверждает уже добавленный кошелек или может добавить новый."
payments_terms_title: "⚡ Сроки выплат"
payments_terms_text: "Средства поступают в течение 24 часов после запроса. Обычно это происходит быстрее."
payments_conditions_title: "📌 Обязательные условия:"
payments_conditions_text_1: "Вывод осуществляется только в стейблкоине USDT. Перевод осуществляется в сети TRC20. Минимальная сумма для вывода – 10$."
payments_conditions_text_2: "Комиссия за каждый вывод — 1$, она списывается автоматически с суммы выплаты."

