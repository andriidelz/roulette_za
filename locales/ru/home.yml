# Feature cards
fund_title: "Еженедельный фонд — 1 000$"
fund_desc: "Каждый игрок имеет шанс попасть в недельный топ и получить долю из призового фонда в 1 000$. С началом новой недели выплату можно вывести на личный криптокошелек."
free_title: "Полностью бесплатная игра"
free_desc: "В игре нет никаких оплат или депозитов. Каждый игрок ежедневно получает бесплатные ставки для угадывания цвета, который выпадет на рулетке, и повышения своей позиции в рейтинге."
withdrawal_title: "Мгновенный вывод средств"
withdrawal_desc: "Вознаграждение можно вывести мгновенно после зачисления — без airdrop-ов и долгих ожиданий. Денежное начисление происходит по понедельникам, и их сразу можно вывести на свой криптокошелек."
fairness_title: "Игра без обмана"
fairness_desc: "Каждое угадывание цвета на рулетке проверяется независимым тестом криптографического хеша SHA-256. Это гарантирует прозрачность системы и исключает возможность мошенничества."
verification_title: "Без верификации"
verification_desc: "Игра проходит прямо в Telegram. Чтобы начать, нужно всего 20 секунд: подтвердить совершеннолетие, выбрать страну, указать никнейм и подписаться на канал бота. Это все условия для старта."
no_ads_title: "Никакой рекламы"
no_ads_desc: "Тебе не придется «платить» за бесплатную игру частыми просмотрами длинной рекламы. Все создано для погружения в игровой процесс и концентрации на выигрыше."

