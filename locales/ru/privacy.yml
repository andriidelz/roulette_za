telegram_specifics: "9. Специфика Telegram"
telegram_controller: "Telegram является отдельным контроллером данных в отношении вашей учетной записи. Мы не контролируем, как Telegram обрабатывает ваши персональные данные. Ознакомьтесь с Политикой конфиденциальности Telegram в их официальных источниках."
minimum_age: "10. Минимальный возраст"
age_restrictions: "Сервис предназначен только для пользователей 18+. Если нам станет известно о том, что пользователь младше этого возраста — мы заблокируем доступ и удалим данные."
automated_decisions: "11. Автоматизированные решения"
anti_fraud_checks: "Мы можем использовать автоматические проверки для антифродовых целей и формирования рейтингов. Они не приводят к юридически значимым решениям без участия человека."
policy_changes: "12. Изменения в Политике"
policy_updates: "Мы можем время от времени обновлять эту Политику. Актуальная версия публикуется в боте (раздел /privacy). Существенные изменения будут сообщены дополнительно."
