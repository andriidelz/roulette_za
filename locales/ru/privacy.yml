no_data_sale: "Мы не продаем и не передаем ваши личные данные третьим компаниям для их целей, кроме случаев, когда вы самостоятельно выразили желание передать ваши данные в рамках кросс-платформенных или партнерских активностей. Данные могут обрабатываться обработчиками (процессорами) исключительно от нашего имени:"
hosting_providers: "Хостинг/инфраструктура (серверы/базы данных)."
