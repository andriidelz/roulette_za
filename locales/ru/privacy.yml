consent: "Согласие (на отдельные опции, если мы его просим явно — его можно отозвать в любой момент)."
data_protection: "4. Защита данных"
security_measures: "Применяем отраслевые меры безопасности: шифрование на транзите (TLS), контроль доступов, журналы аудита, изоляция сред."
access_control: "Доступ к данным имеют только уполномоченные сотрудники/подрядчики по принципу минимально необходимого доступа."
internal_audits: "Проводим периодические внутренние проверки безопасности."
