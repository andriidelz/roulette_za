data_processing_policy: "Обработка данных выполняется исключительно в пределах политик конфиденциальности отдельных провайдеров или сервисов."
international_transfer: "6. Международная передача"
data_protection_guarantees: "Наши серверы или подрядчики могут находиться за пределами вашей страны. Все необходимые гарантии и стандарты защиты данных обеспечиваются и регулируются политиками конфиденциальности соответствующих поставщиков услуг."
storage_periods: "7. Сроки хранения"
gaming_data_storage: "Игровые данные и журналы событий: хранятся в течение всей активности аккаунта, если не заявлено иное."
payment_records_storage: "Платежные записи: в течение срока, пока пользователь не изменил их или не удалил, но не дольше, чем нужно для функционала бота."
anonymized_analytics_storage: "Анонимизированная аналитика: может храниться дольше, поскольку не идентифицирует личность."
