# PostgreSQL configuration optimized for 32GB RAM / 8 CPU server

# CONNECTIONS AND AUTHENTICATION
max_connections = 200
superuser_reserved_connections = 3

# MEMORY SETTINGS
# Use 25% of total RAM for shared_buffers (8GB out of 32GB)
shared_buffers = 8GB
# Use 75% of RAM for effective_cache_size (24GB out of 32GB)
effective_cache_size = 24GB
# Memory for complex sorts and hash operations per connection
work_mem = 64MB
# Memory for maintenance operations (vacuum, create index, etc.)
maintenance_work_mem = 1GB
# Memory for autovacuum workers
autovacuum_work_mem = 512MB

# WAL (Write-Ahead Logging) SETTINGS
# Reduce disk I/O by increasing WAL buffers
wal_buffers = 64MB
# Size of WAL segment files
max_wal_size = 4GB
min_wal_size = 1GB
# WAL writer settings
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# CHECKPOINT SETTINGS
# Reduce checkpoint frequency to decrease I/O spikes
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
checkpoint_flush_after = 256kB

# QUERY PLANNER SETTINGS
random_page_cost = 1.1  # For SSD storage
effective_io_concurrency = 200  # For SSD with good concurrent I/O

# BACKGROUND WRITER SETTINGS
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# VACUUM AND ANALYZE SETTINGS
# More aggressive autovacuum for high-load systems
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000

# STATISTICS (optimized for production)
# Enable essential query statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = none  # Disabled for production performance

# LOGGING (production-optimized)
# Standard stderr logging only
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'  # Daily rotation
log_file_mode = 0600
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

# Production logging levels
log_min_messages = warning  # Only warnings and errors
log_error_verbosity = terse  # Minimal error details

# Log only slow queries and critical issues
log_min_duration_statement = 5000  # Log queries taking more than 5 seconds
log_line_prefix = '%t [%p]: [%l-1] '  # No sensitive user/db info in logs
log_lock_waits = on  # Important for deadlock detection
log_temp_files = 50MB  # Only large temp files
log_checkpoints = off  # Disabled for production
log_connections = off
log_disconnections = off
log_statement = 'none'
log_duration = off
log_hostname = off
log_timezone = 'UTC'

# Autovacuum logging (only long operations)
log_autovacuum_min_duration = 10000  # Log vacuum operations > 10 seconds

# RUNTIME CONFIGURATION
listen_addresses = '*'
port = 5432
max_files_per_process = 1000

# LOCK MANAGEMENT
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64

# CLIENT CONNECTION DEFAULTS
default_text_search_config = 'pg_catalog.english'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# ADVANCED OPTIMIZATION
# Parallel query settings
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# JIT compilation for complex queries
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# REPLICATION (if needed in future)
# wal_level = replica
# max_wal_senders = 3
# max_replication_slots = 3

# EXTENSIONS CONFIGURATION
# Enable pg_stat_statements for query performance tracking
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top  # Only top-level statements for better performance
pg_stat_statements.track_utility = off
pg_stat_statements.save = on
