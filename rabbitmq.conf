# RabbitMQ configuration optimized for performance

# MEMORY MANAGEMENT
# Limit memory usage to 768MB (leave room for other processes)
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.5

# DISK MANAGEMENT
# Free disk space limit (in bytes) - 2GB
disk_free_limit.absolute = 2GB

# PERFORMANCE TUNING
# TCP listener options
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0
tcp_listen_options.keepalive = true

# Heartbeat interval (seconds)
heartbeat = 60

# CONNECTION LIMITS
# Maximum number of connections
connection_max = 5000

# QUEUE MANAGEMENT
# Default queue type
default_queue_type = quorum

# Message TTL and size limits
# max_message_size = 134217728  # 128MB
# default_user_tags.administrator = true

# CLUSTERING AND HIGH AVAILABILITY
# Queue master locator policy
queue_master_locator = min-masters

# LOGGING
# Log levels: debug, info, warning, error, critical, none
log.console = true
log.console.level = warning
log.file = false
log.file.level = none
log.file.rotation.date = $D0
log.file.rotation.size = 104857600  # 100MB

# MANAGEMENT PLUGIN
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.http_log_dir = /var/log/rabbitmq/management
management.rates_mode = basic

# PERFORMANCE OPTIMIZATIONS
# Channel max number
channel_max = 2048

# Collect statistics more frequently for monitoring
collect_statistics_interval = 5000

# NETWORK TUNING
# TCP buffer sizes
tcp_listen_options.sndbuf = 32768
tcp_listen_options.recbuf = 32768

# SECURITY
# Disable guest user for remote connections
loopback_users.guest = true

# SSL/TLS (uncomment if using SSL)
# ssl_options.cacertfile = /etc/ssl/certs/ca-certificates.crt
# ssl_options.certfile = /etc/ssl/certs/server.pem
# ssl_options.keyfile = /etc/ssl/private/server.key
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = false
