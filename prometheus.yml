global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Мониторинг самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /prometheus/metrics

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # RabbitMQ Exporter
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
    
  # Node Exporter для системных метрик
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    
  # Go Runtime Metrics
  - job_name: 'roulette-bot'
    static_configs:
      - targets: ['bot:9101']
    metrics_path: /metrics

  - job_name: 'roulette-rotator'
    static_configs:
      - targets: ['rotator:9102']
    metrics_path: /metrics

  - job_name: 'roulette-admin'
    static_configs:
      - targets: ['admin:9103']
    metrics_path: /metrics
